name: Deploy to VPS

on:
  push:
    branches: [main]

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: pnpm/action-setup@v4
        with:
          version: 9.12.0
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @docgen/renderer exec playwright install --with-deps chromium
      - run: pnpm build:all
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm lint
      - name: Check formatting of changed files
        env:
          BEFORE: ${{ github.event.before }}
        run: git diff --name-only -z "$BEFORE" "$GITHUB_SHA" -- '*.ts' '*.tsx' '*.js' '*.mjs' '*.json' '*.yml' '*.yaml' | xargs -0 -r pnpm exec prettier --check
      - run: node scripts/check-renderer.mjs
  deploy:
    needs: validate
    runs-on: ubuntu-latest
    steps:
      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          port: ${{ secrets.VPS_PORT || 22 }}
          command_timeout: 20m
          script: |
            set -e
            cd /var/www/docgen
            test -d .git
            if [ -n "$(git status --porcelain --untracked-files=no)" ]; then
              echo "Checkout VPS memiliki perubahan lokal; deploy dihentikan"
              exit 1
            fi
            available_kb=$(df -Pk . | awk 'NR==2 {print $4}')
            if [ "$available_kb" -lt 2097152 ]; then
              echo "Ruang kosong VPS kurang dari 2 GB; deploy dihentikan"
              exit 1
            fi
            pm2 describe docgen-api >/dev/null
            pm2 describe docgen-worker >/dev/null
            git pull --ff-only origin main
            pnpm install --frozen-lockfile
            # Playwright browser binaries live outside the repo and may be absent after deploy.
            pnpm --filter @docgen/renderer exec playwright install chromium
            pnpm build:all          # dashboard di-build dgn base '/' (root)
            node scripts/check-renderer.mjs # local-only PDF smoke, no credits used
            pnpm db:migrate          # terapkan migrasi (mis. 0012_owner_settings)

            # root bisa langsung; non-root pakai sudo (butuh NOPASSWD).
            SUDO=""; [ "$(id -u)" -ne 0 ] && SUDO="sudo"

            # --- Pastikan DASHBOARD_URL = domain root (tanpa /app) ---
            ENVF=/var/www/docgen/.env
            DURL="https://docgen.razornez.net"
            if grep -q '^DASHBOARD_URL=' "$ENVF"; then
              sed -i "s#^DASHBOARD_URL=.*#DASHBOARD_URL=${DURL}#" "$ENVF"
            else
              echo "DASHBOARD_URL=${DURL}" >> "$ENVF"
            fi

            # --- Terapkan nginx (SPA di root) dgn gerbang nginx -t + restore ---
            NSRC=/var/www/docgen/scripts/nginx-production.conf
            NDST=/etc/nginx/sites-available/docgen
            BAK="${NDST}.bak.$(date +%s)"
            if [ -f "$NDST" ]; then $SUDO cp "$NDST" "$BAK"; fi
            $SUDO cp "$NSRC" "$NDST"
            $SUDO ln -sf "$NDST" /etc/nginx/sites-enabled/docgen
            if $SUDO nginx -t; then
              $SUDO systemctl reload nginx
              echo "nginx: konfigurasi root diterapkan & di-reload"
            else
              echo "nginx -t GAGAL — kembalikan konfigurasi sebelumnya"
              if [ -f "$BAK" ]; then $SUDO cp "$BAK" "$NDST" && $SUDO systemctl reload nginx || true; fi
              exit 1
            fi

            pm2 reload ecosystem.config.cjs --update-env
            for attempt in $(seq 1 12); do
              if curl --fail --silent --show-error https://docgen.razornez.net/health >/dev/null; then
                echo "API, Redis, database, dan render worker sehat"
                break
              fi
              if [ "$attempt" -eq 12 ]; then
                echo "Health check gagal setelah reload PM2"
                exit 1
              fi
              sleep 5
            done
            echo "Deploy selesai: $(date)"

      - name: Notify on failure
        if: failure()
        continue-on-error: true
        uses: dawidd6/action-send-mail@v4
        with:
          server_address: smtp.gmail.com
          server_port: 465
          secure: true
          username: ${{ secrets.MAIL_USERNAME }}
          password: ${{ secrets.MAIL_PASSWORD }}
          subject: '[GAGAL] Deploy docgen - ${{ github.sha }}'
          to: ${{ secrets.NOTIFY_EMAIL }}
          from: GitHub Actions <${{ secrets.MAIL_USERNAME }}>
          body: |
            Deploy GAGAL!

            Repository: ${{ github.repository }}
            Branch: ${{ github.ref_name }}
            Commit: ${{ github.sha }}
            Commit message: ${{ github.event.head_commit.message }}
            Triggered by: ${{ github.actor }}

            Cek detail error di:
            https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}
      - name: Notify on success
        if: success()
        continue-on-error: true
        uses: dawidd6/action-send-mail@v4
        with:
          server_address: smtp.gmail.com
          server_port: 465
          secure: true
          username: ${{ secrets.MAIL_USERNAME }}
          password: ${{ secrets.MAIL_PASSWORD }}
          subject: '[SUKSES] Deploy docgen - ${{ github.sha }}'
          to: ${{ secrets.NOTIFY_EMAIL }}
          from: GitHub Actions <${{ secrets.MAIL_USERNAME }}>
          body: |
            Deploy SUKSES!

            Repository: ${{ github.repository }}
            Branch: ${{ github.ref_name }}
            Commit: ${{ github.sha }}
            Commit message: ${{ github.event.head_commit.message }}
            Triggered by: ${{ github.actor }}

            Lihat detail di:
            https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}
